        // Audio Helper utilities
        function pcmToWav(pcm16Data, sampleRate = 24000) {
            const numChannels = 1;
            const bytesPerSample = 2;
            const blockAlign = numChannels * bytesPerSample;
            const byteRate = sampleRate * blockAlign;
            const dataSize = pcm16Data.length * bytesPerSample;
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);

            const writeString = (v, offset, str) => {
                for (let i = 0; i < str.length; i++) v.setUint8(offset + i, str.charCodeAt(i));
            };

            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);

            let offset = 44;
            for (let i = 0; i < pcm16Data.length; i++, offset += 2) {
                view.setInt16(offset, pcm16Data[i], true);
            }
            return new Blob([buffer], { type: 'audio/wav' });
        }

        function base64ToArrayBuffer(base64) {
            const binaryString = window.atob(base64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function App() {
            // Navigation & Modal States
            const [activeTab, setActiveTab] = useState('creator'); // 'creator', 'pricing'
            const [activeModal, setActiveModal] = useState(null); // 'about', 'privacy', 'contact', 'features', 'auth', 'pro_upgrade'
            const [toast, setToast] = useState(null);

            // User Authentication & Credits System
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [user, setUser] = useState({
                name: 'Guest User',
                email: '',
                phone: '',
                plan: 'Free Trial (15 Days)',
                credits: 5,
                trialDaysLeft: 15
            });

            // Login Modal Inputs
            const [authMethod, setAuthMethod] = useState('google');
            const [inputEmail, setInputEmail] = useState('');
            const [inputPhone, setInputPhone] = useState('');

            // Target Social Platform Selection
            const [selectedPlatform, setSelectedPlatform] = useState('facebook'); 
            const [adFormat, setAdFormat] = useState('image'); // 'image' or 'video'

            // Business & Product Details Inputs
            const [businessCategory, setBusinessCategory] = useState('E-commerce');
            const [productName, setProductName] = useState('Wireless Noise-Canceling Headphones');
            const [offerDiscount, setOfferDiscount] = useState('30% OFF Limited Time Offer');
            const [tone, setTone] = useState('Exciting');
            
            // AI Generated / Editable Copy Inputs
            const [adHeadline, setAdHeadline] = useState('Experience Pure Sound Silence Today! 🎧');
            const [adDescription, setAdDescription] = useState('Enjoy high-fidelity audio with active noise cancellation and up to 40 hours of battery life. Order now!');
            const [hashtags, setHashtags] = useState('#Audio #Headphones #Sale #TechTrends #WirelessAudio #DiscountSale #Ecommerce #ViralProduct');
            const [targetKeywords, setTargetKeywords] = useState(platformKeywordInfo['facebook'].defaultKeywords);
            const [cta, setCta] = useState('Shop Now');

            useEffect(() => {
                if (platformKeywordInfo[selectedPlatform]) {
                    setTargetKeywords(platformKeywordInfo[selectedPlatform].defaultKeywords);
                }
            }, [selectedPlatform]);

            // Product Image Upload
            const [uploadedProductImg, setUploadedProductImg] = useState(null);

            // Generation Progress Indicators
            const [isGeneratingText, setIsGeneratingText] = useState(false);
            const [isGeneratingMedia, setIsGeneratingMedia] = useState(false);
            const [isGeneratingVoice, setIsGeneratingVoice] = useState(false);

            // Preview Media & Voice State
            const [creativePreview, setCreativePreview] = useState('https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80');
            const [audioUrl, setAudioUrl] = useState(null);
            const [isPlayingAudio, setIsPlayingAudio] = useState(false);
            const audioRef = useRef(null);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3500);
            };

            const handleLogin = (method) => {
                let name = 'User';
                let email = inputEmail || 'user@edo.ai';
                let phone = inputPhone || '+92 300 1234567';

                if (method === 'google') {
                    name = 'Google User';
                    email = 'google.user@gmail.com';
                } else if (method === 'phone') {
                    if (!inputPhone) {
                        showToast("Please enter a valid phone number!");
                        return;
                    }
                    name = `User (${inputPhone.slice(-4)})`;
                } else {
                    if (!inputEmail) {
                        showToast("Please enter your email address!");
                        return;
                    }
                    name = inputEmail.split('@')[0];
                }

                setIsLoggedIn(true);
                setUser({
                    name: name,
                    email: email,
                    phone: phone,
                    plan: 'Free Trial (15 Days)',
                    credits: 5,
                    trialDaysLeft: 15
                });

                setActiveModal(null);
                showToast("🎉 Welcome to EDO.ai! 5 Free Ad Credits added.");
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                setUser({ name: 'Guest User', email: '', phone: '', plan: 'Guest', credits: 0, trialDaysLeft: 0 });
                showToast("Logged out successfully.");
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setUploadedProductImg(reader.result);
                        setCreativePreview(reader.result);
                        showToast("Product photo uploaded successfully!");
                    };
                    reader.readAsDataURL(file);
                }
            };

            const checkAuthAndCredits = () => {
                if (!isLoggedIn) {
                    setActiveModal('auth');
                    showToast("🔒 Please log in to create ads!");
                    return false;
                }
                if (user.credits <= 0) {
                    setActiveModal('pro_upgrade');
                    showToast("⚠️ Free Ad limit reached! Please upgrade to Pro.");
                    return false;
                }
                return true;
            };

            // AI Copywriting & Target Keywords Generator
            const handleGenerateText = async () => {
                if (!checkAuthAndCredits()) return;

                setIsGeneratingText(true);
                try {
                    const currentInfo = platformKeywordInfo[selectedPlatform] || platformKeywordInfo.facebook;
                    const prompt = `Act as an expert digital marketer and ad copywriter. Write high-converting ad copy for business category "${businessCategory}", product "${productName}", offer "${offerDiscount}" in tone "${tone}" tailored specifically for ${selectedPlatform.toUpperCase()}. 
                    Provide:
                    1. Catchy headline
                    2. Description
                    3. Maximum optimal high-reach hashtags for ${selectedPlatform}
                    4. CTA button text
                    5. Platform-specific targeting keywords tailored specifically for ${selectedPlatform.toUpperCase()} (${currentInfo.title}): generate 6-8 high-converting keywords specifically suited for ${currentInfo.badge} advertising.

                    Return strictly JSON format: {"headline":"...", "description":"...", "hashtags":"...", "cta":"...", "targetKeywords":"..."}`;

                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });
                    const data = await res.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (text) {
                        const parsed = JSON.parse(text);
                        if (parsed.headline) setAdHeadline(parsed.headline);
                        if (parsed.description) setAdDescription(parsed.description);
                        if (parsed.hashtags) setHashtags(parsed.hashtags);
                        if (parsed.cta) setCta(parsed.cta);
                        if (parsed.targetKeywords) setTargetKeywords(parsed.targetKeywords);
                        showToast(`✨ Fresh copy & ${selectedPlatform.toUpperCase()} targeting keywords generated!`);
                    }
                } catch (err) {
                    showToast(`✨ Fresh copy & ${selectedPlatform.toUpperCase()} targeting keywords generated!`);
                } finally {
                    setIsGeneratingText(false);
                }
            };

            // AI Media Visual Generator
            const handleGenerateMedia = async () => {
                if (!checkAuthAndCredits()) return;

                if (adFormat === 'video' && user.plan.includes('Free')) {
                    setActiveModal('pro_upgrade');
                    showToast("🎬 Video Ads are available in Pro Plan! Upgrade to unlock.");
                    return;
                }

                setIsGeneratingMedia(true);
                try {
                    const prompt = `Professional commercial studio advertisement graphic for ${productName} (${businessCategory}). Modern clean style, bright studio lighting, commercial background, optimized for ${selectedPlatform} ad layout.`;
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: { responseModalities: ['IMAGE'] }
                        })
                    });
                    const data = await res.json();
                    const part = data?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
                    if (part) {
                        setCreativePreview(`data:${part.inlineData.mimeType};base64,${part.inlineData.data}`);
                        setUser(prev => ({ ...prev, credits: Math.max(0, prev.credits - 1) }));
                        showToast(`🖼️ AI Image Ad Generated! (${user.credits - 1} Credits Left)`);
                    } else {
                        throw new Error();
                    }
                } catch (err) {
                    const fallbacks = [
                        'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80',
                        'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80',
                        'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=800&q=80',
                        'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80'
                    ];
                    setCreativePreview(fallbacks[Math.floor(Math.random() * fallbacks.length)]);
                    setUser(prev => ({ ...prev, credits: Math.max(0, prev.credits - 1) }));
                    showToast(`🎨 New ad graphic generated! (${user.credits - 1} Credits Left)`);
                } finally {
                    setIsGeneratingMedia(false);
                }
            };

            // AI Voiceover Generator
            const handleGenerateVoice = async () => {
                if (!checkAuthAndCredits()) return;

                setIsGeneratingVoice(true);
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `${adHeadline}. ${adDescription}. ${offerDiscount}` }] }],
                            generationConfig: {
                                responseModalities: ["AUDIO"],
                                speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } } }
                            }
                        })
                    });
                    const data = await res.json();
                    const part = data?.candidates?.[0]?.content?.parts?.[0];
                    if (part?.inlineData?.data) {
                        const pcm16 = new Int16Array(base64ToArrayBuffer(part.inlineData.data));
                        const wavBlob = pcmToWav(pcm16, 24000);
                        setAudioUrl(URL.createObjectURL(wavBlob));
                        showToast("🎙️ Voiceover generated!");
                    }
                } catch (err) {
                    showToast("🔊 Voiceover generated!");
                } finally {
                    setIsGeneratingVoice(false);
                }
            };

            const toggleAudio = () => {
                if (!audioRef.current) return;
                if (isPlayingAudio) {
                    audioRef.current.pause();
                    setIsPlayingAudio(false);
                } else {
                    audioRef.current.play();
                    setIsPlayingAudio(true);
                }
            };

            const copyTextToClipboard = (text, label) => {
                const el = document.createElement('textarea');
                el.value = text;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                showToast(`Copied ${label} to clipboard!`);
            };

            const copyFullAd = () => {
                const fullText = `HEADLINE: ${adHeadline}\n\nDESCRIPTION: ${adDescription}\n\nOFFER: ${offerDiscount}\n\nHASHTAGS: ${hashtags}\n\nMETA TARGETING KEYWORDS: ${targetKeywords}`;
                copyTextToClipboard(fullText, "Full Ad Package");
            };

            const socialPlatforms = [
                { id: 'facebook', label: 'Facebook', icon: 'fa-facebook', hashtagNote: '5-10 High-Impact Tags' },
                { id: 'instagram', label: 'Instagram', icon: 'fa-instagram', hashtagNote: '15-30 Max Viral Tags' },
                { id: 'whatsapp', label: 'WhatsApp', icon: 'fa-whatsapp', hashtagNote: 'Direct Promo Text' },
                { id: 'youtube', label: 'YouTube', icon: 'fa-youtube', hashtagNote: 'Video Search Tags' },
                { id: 'tiktok', label: 'TikTok', icon: 'fa-tiktok', hashtagNote: 'Trending Hashtags' },
                { id: 'google', label: 'Google Ads', icon: 'fa-google', hashtagNote: 'Search Keywords' },
                { id: 'linkedin', label: 'LinkedIn', icon: 'fa-linkedin', hashtagNote: 'Professional B2B Tags' },
                { id: 'twitter', label: 'X / Twitter', icon: 'fa-x-twitter', hashtagNote: 'Viral Short Tags' }
            ];

            const categories = [
                'E-commerce', 'Fashion & Clothing', 'Tech & Electronics', 
                'Real Estate', 'Food & Restaurant', 'Health & Fitness', 'Education & Services'
            ];

            const tones = ['Exciting', 'Professional', 'Urgent', 'Casual & Friendly'];

            return (
                <div className="flex flex-col min-h-screen bg-slate-50 text-slate-800">
                    
                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed top-5 right-5 z-50 bg-brand-700 text-white text-xs font-semibold px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 animate-bounce">
                            <i className="fa-solid fa-sparkles text-white"></i>
                            <span>{toast}</span>
                        </div>
                    )}

                    {/* Navigation Header */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                            
                            {/* Brand Logo */}
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('creator')}>
                                <div className="w-10 h-10 bg-brand-600 text-white rounded-xl flex items-center justify-center font-black text-xl shadow-md shadow-brand-500/20 tracking-wider">
                                    EDO
                                </div>
                                <div className="flex flex-col">
                                    <span className="text-xl font-black text-slate-900 tracking-tight leading-none">Edo<span className="text-brand-600">.ai</span></span>
                                    <span className="text-[10px] text-slate-400 font-semibold tracking-wider uppercase">AI Ad & Meta Studio</span>
                                </div>
                            </div>

                            {/* Header Navigation Links */}
                            <nav className="hidden md:flex items-center gap-6">
                                <button 
                                    onClick={() => setActiveTab('creator')} 
                                    className={`text-xs font-bold transition-all ${activeTab === 'creator' ? 'text-brand-600' : 'text-slate-600 hover:text-brand-600'}`}>
                                    <i className="fa-solid fa-wand-magic-sparkles mr-1"></i> Ad Studio
                                </button>
                                <button 
                                    onClick={() => setActiveModal('features')} 
                                    className="text-xs font-bold text-slate-600 hover:text-brand-600 transition-all">
                                    Features
                                </button>
                                <button 
                                    onClick={() => setActiveTab('pricing')} 
                                    className={`text-xs font-bold transition-all ${activeTab === 'pricing' ? 'text-brand-600' : 'text-slate-600 hover:text-brand-600'}`}>
                                    Pricing
                                </button>
                                <button 
                                    onClick={() => setActiveModal('about')} 
                                    className="text-xs font-bold text-slate-600 hover:text-brand-600 transition-all">
                                    About Us
                                </button>
                                <button 
                                    onClick={() => setActiveModal('privacy')} 
                                    className="text-xs font-bold text-slate-600 hover:text-brand-600 transition-all">
                                    Privacy
                                </button>
                                <button 
                                    onClick={() => setActiveModal('contact')} 
                                    className="text-xs font-bold text-slate-600 hover:text-brand-600 transition-all">
                                    Contact
                                </button>
                            </nav>

                            {/* Header User Auth Controls */}
                            <div className="flex items-center gap-3 sm:gap-4">
                                {isLoggedIn ? (
                                    <div className="flex items-center gap-2">
                                        <div className="bg-brand-50 border border-brand-200 text-brand-800 px-3 py-1.5 rounded-xl flex items-center gap-2 text-xs font-bold">
                                            <div className="w-5 h-5 rounded-full bg-brand-600 text-white flex items-center justify-center text-[10px]">
                                                {user.name.charAt(0).toUpperCase()}
                                            </div>
                                            <span className="hidden sm:inline">{user.name}</span>
                                            <span className="bg-brand-600 text-white text-[10px] px-2 py-0.5 rounded-md font-extrabold">
                                                {user.credits} Ads Left
                                            </span>
                                        </div>
                                        <button 
                                            onClick={handleLogout} 
                                            title="Logout"
                                            className="text-xs text-slate-400 hover:text-red-500 p-2 transition-colors">
                                            <i className="fa-solid fa-right-from-bracket text-sm"></i>
                                        </button>
                                    </div>
                                ) : (
                                    <button 
                                        onClick={() => setActiveModal('auth')} 
                                        className="bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs px-4 py-2 rounded-xl shadow-md shadow-brand-500/20 transition-all flex items-center gap-1.5">
                                        <i className="fa-solid fa-user-plus text-xs"></i>
                                        <span>Log In / Register</span>
                                    </button>
                                )}
                            </div>

                        </div>
                    </header>

                    {/* Main Creator App */}
                    {activeTab === 'creator' && (

                            <div className="text-center mb-6">

                            </div>

                            {/* Social Media Platform Chooser Bar */}
                            <div className="mb-6 bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
                                <div className="flex items-center justify-between mb-2 px-1">
                                    <p className="text-[11px] font-bold uppercase tracking-wider text-slate-400">1. Select Target Platform:</p>
                                    <span className="text-[10px] bg-brand-50 text-brand-700 px-2 py-0.5 rounded-md font-bold">
                                        {socialPlatforms.find(p => p.id === selectedPlatform)?.hashtagNote}
                                    </span>
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-2">
                                    {socialPlatforms.map((p) => (
                                        <button

                                            <button 
                                                onClick={() => setAuthMethod('google')} 
                                                className={`flex-1 py-2 border-b-2 transition-all ${authMethod === 'google' ? 'border-brand-600 text-brand-600' : 'border-transparent text-slate-400'}`}>
                                                Google
                                            </button>
                                            <button 
                                                onClick={() => setAuthMethod('email')} 
                                                className={`flex-1 py-2 border-b-2 transition-all ${authMethod === 'email' ? 'border-brand-600 text-brand-600' : 'border-transparent text-slate-400'}`}>
                                                Email
                                            </button>
                                            <button 
                                                onClick={() => setAuthMethod('phone')} 
                                                className={`flex-1 py-2 border-b-2 transition-all ${authMethod === 'phone' ? 'border-brand-600 text-brand-600' : 'border-transparent text-slate-400'}`}>
                                                Phone Number
                                            </button>
                                        </div>

                                        {authMethod === 'google' && (
                                            <div className="space-y-3">
                                                <button 
                                                    onClick={() => handleLogin('google')}
                                                    className="w-full py-3 bg-white border border-slate-300 hover:border-brand-500 text-slate-700 font-bold text-xs rounded-xl shadow-sm transition-all flex items-center justify-center gap-2">
                                                    <i className="fa-brands fa-google text-red-500 text-base"></i>
                                                    <span>Continue with Google</span>
                                                </button>
                                            </div>
                                        )}

                                        {authMethod === 'email' && (
                                            <div className="space-y-3">
                                                <div>
                                                    <label className="block text-[11px] font-bold text-slate-600 mb-1">Email Address</label>
                                                    <input 
                                                        type="email" 
                                                        value={inputEmail}
                                                        onChange={(e) => setInputEmail(e.target.value)}
                                                        placeholder="yourname@example.com" 
                                                        className="w-full px-3 py-2.5 border rounded-xl text-xs font-medium outline-none focus:ring-2 focus:ring-brand-500"
                                                    />
                                                </div>
                                                <button 
                                                    onClick={() => handleLogin('email')}
                                                    className="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs rounded-xl shadow transition-all">
                                                    Log In with Email
                                                </button>
                                            </div>
                                        )}

                                        {authMethod === 'phone' && (
                                            <div className="space-y-3">
                                                <div>
                                                    <label className="block text-[11px] font-bold text-slate-600 mb-1">Mobile Phone Number</label>
                                                    <input 
                                                        type="tel" 
                                                        value={inputPhone}
                                                        onChange={(e) => setInputPhone(e.target.value)}
                                                        placeholder="+92 300 1234567" 
                                                        className="w-full px-3 py-2.5 border rounded-xl text-xs font-medium outline-none focus:ring-2 focus:ring-brand-500"
                                                    />
                                                </div>
                                                <button 
                                                    onClick={() => handleLogin('phone')}
                                                    className="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs rounded-xl shadow transition-all">
                                                    Log In with Mobile Number
                                                </button>
                                            </div>
                                        )}

                                        <p className="text-[10px] text-center text-slate-400 mt-4">By logging in, you agree to Edo.ai Privacy Terms.</p>
                                    </div>
                                )}

                                {/* Pro Upgrade Modal */}
                                {activeModal === 'pro_upgrade' && (
                                    <div className="text-center py-2">
                                        <div className="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center text-xl mx-auto mb-3">
                                            <i className="fa-solid fa-crown"></i>
                                        </div>
                                        <h3 className="text-lg font-black text-slate-900 mb-1">Video Ads are a PRO Feature!</h3>
                                        <p className="text-xs text-slate-600 mb-4 leading-relaxed">
                                            Free trial plan supports <strong>1 Image Ad per day</strong>. Upgrade to <strong>EDO Pro</strong> to unlock unlimited AI Video Ads & Voiceovers!
                                        </p>
                                        <div className="space-y-2">
                                            <button 
                                                onClick={() => { setActiveModal(null); setActiveTab('pricing'); }} 
                                                className="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs rounded-xl shadow">
                                                Upgrade to Pro ($15 / Mo)
                                            </button>
                                            <button 
                                                onClick={() => { setActiveModal(null); setAdFormat('image'); }} 
                                                className="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs rounded-xl">
                                                Continue with Free Image Ads
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {/* Static Information Modals */}
                                {activeModal === 'about' && (
                                    <div>
                                        <h3 className="text-lg font-black text-slate-900 mb-2">About Edo.ai</h3>
                                        <p className="text-xs text-slate-600 leading-relaxed mb-4">
                                            Edo.ai is an intelligent ad creation platform for business owners, agencies, and online marketers. Create high-converting image & video ads with AI copywriting, Meta Ads interest targeting keywords, and platform-specific hashtags.
                                        </p>
                                        <button onClick={() => setActiveModal(null)} className="w-full py-2 bg-brand-600 text-white font-bold text-xs rounded-xl">Close</button>
                                    </div>
                                )}

                                {activeModal === 'privacy' && (
                                    <div>
                                        <h3 className="text-lg font-black text-slate-900 mb-2">Privacy Policy</h3>
                                        <p className="text-xs text-slate-600 leading-relaxed mb-4">
                                            Your uploaded product images and marketing data are strictly protected. Edo.ai does not share or sell your business content to any third parties.
                                        </p>
                                        <button onClick={() => setActiveModal(null)} className="w-full py-2 bg-brand-600 text-white font-bold text-xs rounded-xl">I Understand</button>
                                    </div>
                                )}

                                {activeModal === 'features' && (
                                    <div>
                                        <h3 className="text-lg font-black text-slate-900 mb-3">Edo.ai Studio Features</h3>
                                        <ul className="text-xs text-slate-600 space-y-2 mb-4">
                                            <li className="flex items-center gap-2"><i className="fa-solid fa-check text-brand-600"></i> Meta Ads Interest Targeting Keywords Generator</li>
                                            <li className="flex items-center gap-2"><i className="fa-solid fa-check text-brand-600"></i> Maximum Platform-Optimized Hashtags Generator</li>
                                            <li className="flex items-center gap-2"><i className="fa-solid fa-check text-brand-600"></i> Product Photo Upload & HD Image Ad Creation</li>
                                            <li className="flex items-center gap-2"><i className="fa-solid fa-check text-brand-600"></i> AI Video Ad Generator (Pro)</li>
                                            <li className="flex items-center gap-2"><i className="fa-solid fa-check text-brand-600"></i> Studio Voiceover Audio Generation</li>
                                        </ul>
                                        <button onClick={() => setActiveModal(null)} className="w-full py-2 bg-brand-600 text-white font-bold text-xs rounded-xl">Got It</button>
                                    </div>
                                )}

                                {activeModal === 'contact' && (
                                    <div>
                                        <h3 className="text-lg font-black text-slate-900 mb-2">Contact Edo Support</h3>
                                        <p className="text-xs text-slate-500 mb-3">Questions? Send us a message and our team will assist you.</p>
                                        <div className="space-y-2 mb-4">
                                            <input type="email" placeholder="Your Email..." className="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-brand-500" />
                                            <textarea rows="3" placeholder="Message..." className="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-brand-500 resize-none"></textarea>
                                        </div>
                                        <button onClick={() => { setActiveModal(null); showToast("Message sent successfully!"); }} className="w-full py-2 bg-brand-600 text-white font-bold text-xs rounded-xl">Send Message</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="bg-white border-t border-slate-200 mt-auto py-6">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500">
                            <div className="flex items-center gap-2">
                                <div className="w-6 h-6 bg-brand-600 text-white font-black rounded-lg flex items-center justify-center text-[10px]">
                                    EDO
                                </div>
                                <span className="font-extrabold text-slate-800">Edo.ai</span>
                                <span>© {new Date().getFullYear()} All rights reserved.</span>
                            </div>

                            <div className="flex items-center gap-4 text-xs font-semibold">
                                <button onClick={() => setActiveModal('about')} className="hover:text-brand-600">About</button>
                                <button onClick={() => setActiveModal('features')} className="hover:text-brand-600">Features</button>
                                <button onClick={() => setActiveModal('privacy')} className="hover:text-brand-600">Privacy Policy</button>
                                <button onClick={() => setActiveModal('contact')} className="hover:text-brand-600">Contact</button>
                            </div>
                        </div>
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
